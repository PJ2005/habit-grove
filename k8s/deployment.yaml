apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-grove
  labels:
    app: habit-grove
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-grove
  template:
    metadata:
      labels:
        app: habit-grove
    spec:
      containers:
        - name: habit-grove
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Never
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://grove-db:5432/grove"
            - name: SPRING_DATASOURCE_USERNAME
              value: "grove"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "grove-dev-password"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
              value: "org.hibernate.dialect.PostgreSQLDialect"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
