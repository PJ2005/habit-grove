apiVersion: apps/v1
kind: Deployment
metadata:
  name: grove-db
  labels:
    app: grove-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grove-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: grove-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: grove-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "grove", "-d", "grove"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grove-db-data
